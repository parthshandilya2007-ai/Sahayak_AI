services:
  # Python FastAPI Backend Web Service
  - type: web
    name: sahayak-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Next.js Frontend Web Service
  - type: web
    name: sahayak-ai-frontend
    env: node
    rootDir: frontend_template
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
