services:
  # Python FastAPI Backend Web Service (Free Plan)
  - type: web
    name: sahayak-ai-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Next.js Frontend Web Service (Free Plan)
  - type: web
    name: sahayak-ai-frontend
    env: node
    plan: free
    rootDir: frontend_template
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
